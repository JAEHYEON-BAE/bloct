name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and verify Release (SDK 27.0, minimum macOS 14.0)
        run: sh scripts/build-release.sh

      - name: Zip app
        run: |
          ditto -c -k --keepParent \
            build/Release/Bloct.app \
            Bloct.zip
          python3 scripts/verify-release.py Bloct.zip

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} Bloct.zip \
            --title "Bloct ${{ github.ref_name }}" \
            --generate-notes

      - name: Homebrew delivery
        run: |
          echo 'Homebrew updates are managed by the homebrew-tap repository.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The Sync Bloct workflow checks new stable releases every 15 minutes.' >> "$GITHUB_STEP_SUMMARY"
